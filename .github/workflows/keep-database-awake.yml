name: Keep database awake

on:
  schedule:
    # Three times a day. Supabase pauses a free project after a week with
    # too few outside requests, and a job inside the database cannot wake it.
    - cron: "15 1 * * *"
    - cron: "15 7 * * *"
    - cron: "15 13 * * *"
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Record today's database heartbeat
        env:
          SUPABASE_URL: https://echmposqqnwystuhzqid.supabase.co
          SUPABASE_KEY: sb_publishable_adc1LhWM4sgykvoKDtjAhw_LV_Xzq6R
        run: |
          curl --fail-with-body -sS -X POST \
            "$SUPABASE_URL/rest/v1/rpc/record_heartbeat" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
