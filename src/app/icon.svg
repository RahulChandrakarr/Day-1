<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a231c"/>
      <stop offset="1" stop-color="#100f0d"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="600" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8a15a" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#cf7f36" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#cf7f36" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="370" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7cf95"/>
      <stop offset="0.55" stop-color="#e8a15a"/>
      <stop offset="1" stop-color="#cf7f36"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="200" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0b77c" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e8a15a"/>
    </linearGradient>
    <clipPath id="sky">
      <rect x="0" y="0" width="1024" height="600"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#glow)"/>

  <!-- rays -->
  <g stroke="url(#ray)" stroke-width="34" stroke-linecap="round" fill="none">
    <line x1="512" y1="228" x2="512" y2="300"/>
    <line x1="512" y1="228" x2="512" y2="300" transform="rotate(-36 512 600)"/>
    <line x1="512" y1="228" x2="512" y2="300" transform="rotate(36 512 600)"/>
    <line x1="512" y1="228" x2="512" y2="300" transform="rotate(-72 512 600)"/>
    <line x1="512" y1="228" x2="512" y2="300" transform="rotate(72 512 600)"/>
  </g>

  <!-- rising sun -->
  <circle cx="512" cy="600" r="232" fill="url(#sun)" clip-path="url(#sky)"/>

  <!-- horizon + reflection -->
  <g stroke-linecap="round" fill="none">
    <line x1="176" y1="600" x2="848" y2="600" stroke="#f0b77c" stroke-width="30"/>
    <line x1="312" y1="672" x2="712" y2="672" stroke="#cf7f36" stroke-width="30" stroke-opacity="0.75"/>
    <line x1="400" y1="740" x2="624" y2="740" stroke="#cf7f36" stroke-width="30" stroke-opacity="0.5"/>
    <line x1="468" y1="806" x2="556" y2="806" stroke="#cf7f36" stroke-width="30" stroke-opacity="0.3"/>
  </g>
</svg>
